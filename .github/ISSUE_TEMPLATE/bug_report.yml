name: Bug report
description: Something in OpenCal doesn't work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. Even a short report helps, and nothing here is too small.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Week view
        2. Long-press a slot
        3. ...
  - type: input
    id: version
    attributes:
      label: OpenCal version
      description: Settings → About
      placeholder: "1.7.0"
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Where did you get it?
      options:
        - GitHub release APK
        - F-Droid
        - Self-built
        - Web app
        - Other
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 7, Android 15
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots or a screen recording are very welcome. Please remove private event details first.
