<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OpenCal promo: intro</title>
<style>
  @font-face { font-family: F6; src: url(../../node_modules/@expo-google-fonts/fraunces/600SemiBold/Fraunces_600SemiBold.ttf); }
  @font-face { font-family: F8; src: url(../../node_modules/@expo-google-fonts/fraunces/800ExtraBold/Fraunces_800ExtraBold.ttf); }
  @font-face { font-family: F8i; src: url(../../node_modules/@expo-google-fonts/fraunces/800ExtraBold_Italic/Fraunces_800ExtraBold_Italic.ttf); }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0c0a08; }
  svg { display: block; }
  text { font-kerning: normal; }
</style>
</head>
<body>
<svg id="svg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script src="lib.js"></script>
<script>
// Intro: a shady guy in a back alley pitches OpenCal, opens his coat, the camera dives into the phone
// and lands on the logo. Edit the lines here; bubble sizes and timing follow the text.
const LINES = [
  ['Psst. Heard you like', 'your privacy.'],
  ['And a calendar that', 'does more?'],
  ['I got you.'],
];
const SHH = 'Shhhh...';

// Timeline (seconds).
const T = {
  bubbles: [0.75, 2.45, 3.95], // pop-in times; each types out, then the next replaces it
  coat: [4.7, 5.1],
  shh: 5.05,
  swing: [5.45, 6.85],
  flood: [6.35, 6.85],
  ring: [6.9, 7.4],
  settle: [7.4, 7.85],
  word: [7.5, 7.95],
  end: 8.1,
};
const CPS = 36; // typing speed, characters per second
// The phone sits in a hidden inside pocket of the coat's right side (as seen when that side is fully open).
const PHONE = { x: 1240, y: 700, rot: 5 };
const FINAL_SCALE = 15; // camera scale when the phone screen fills the frame

const COAT = '#6E5440', COAT_DARK = '#4F3C2D', GLOVE = '#0E0B09';
const LEFT_FLAP = [[848, 490], [952, 476], [1010, 610], [1014, 866], [836, 866]];
const PIVOT = 850, FREE = 1014;

function build() {
  const bricks = `<pattern id="bricks" width="160" height="64" patternUnits="userSpaceOnUse">
      <rect width="160" height="64" fill="#1C1814"/>
      <path d="M0 1.5H160M0 33.5H160M1.5 0V32M81.5 32V64" stroke="#2A231D" stroke-width="3"/>
      <path d="M8 10h60M92 44h50" stroke="#221C17" stroke-width="6" opacity=".6"/>
    </pattern>`;
  const flapPts = (pts) => pts.map((p) => p.join(',')).join(' ');
  const rightPts = LEFT_FLAP.map(([x, y]) => [2000 - x, y]);
  const flap = (side, pts) => `
    <g id="flap-${side}">
      <g id="flap-${side}-out">
        <polygon points="${flapPts(pts)}" fill="url(#coatGrad)" stroke="#3A2C21" stroke-width="3" stroke-linejoin="round"/>
        <rect x="${side === 'l' ? 836 : 986}" y="652" width="178" height="26" fill="#4A3829"/>
        ${side === 'l' ? '<rect x="968" y="646" width="30" height="38" rx="5" fill="none" stroke="#C9A55C" stroke-width="5"/>' : '<circle cx="1052" cy="740" r="7" fill="#3A2C21"/><circle cx="1052" cy="800" r="7" fill="#3A2C21"/>'}
        <path d="M${side === 'l' ? '952 476 L1004 600' : '1048 476 L996 600'}" stroke="#8C6E53" stroke-width="4" opacity=".7"/>
      </g>
      <g id="flap-${side}-in">
        <polygon points="${flapPts(pts)}" fill="url(#lining)" stroke="#5E1E14" stroke-width="3" stroke-linejoin="round"/>
        <polygon points="${flapPts(pts)}" fill="url(#quilt)" opacity=".5"/>
      </g>
    </g>`;

  // Phone (app launch screen: paper + logo, ring drawn later) tucked in the lining's pocket. Drawn
  // in the open-flap position; seek() squashes it with the flap as it swings.
  const phone = `
    <g id="phoneWrap">
      <g id="phone" transform="rotate(${PHONE.rot} ${PHONE.x} ${PHONE.y})">
        <g id="bezel"><rect x="${PHONE.x - 32}" y="${PHONE.y - 66}" width="64" height="132" rx="11" fill="#0E0B09" stroke="#3A3129" stroke-width="1.5"/></g>
        <rect x="${PHONE.x - 28}" y="${PHONE.y - 62}" width="56" height="124" rx="8" fill="${PAPER}"/>
        <circle id="cam" cx="${PHONE.x}" cy="${PHONE.y - 57}" r="1.6" fill="#0E0B09"/>
        <g transform="translate(${PHONE.x} ${PHONE.y}) scale(${400 / FINAL_SCALE / 1000}) translate(-500 -500)">${logoMark('pl')}</g>
      </g>
      <g id="pocket">
        <path d="M${PHONE.x - 46} 742 Q${PHONE.x} 750 ${PHONE.x + 46} 740 L${PHONE.x + 44} 808 Q${PHONE.x} 814 ${PHONE.x - 44} 808 Z" fill="#9B3424" stroke="#6E2217" stroke-width="3" stroke-linejoin="round"/>
        <path d="M${PHONE.x - 38} 752 Q${PHONE.x} 759 ${PHONE.x + 38} 750" stroke="#FFD2C4" stroke-width="2" stroke-dasharray="6 5" fill="none" opacity=".6"/>
      </g>
    </g>`;

  // "Shhhh..." lives in the scene, above the open side of the coat; the camera dives past it.
  const shhText = `<g id="shh"></g>`;

  $('svg').innerHTML = `
    <defs>
      ${bricks}
      <pattern id="quilt" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <path d="M0 0H28M0 0V28" stroke="#FFD2C4" stroke-width="1.5" stroke-dasharray="4 4" opacity=".5"/>
      </pattern>
      <linearGradient id="coatGrad" x1="820" y1="0" x2="1180" y2="0" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#9A7A5C"/><stop offset=".45" stop-color="${COAT}"/><stop offset="1" stop-color="${COAT_DARK}"/>
      </linearGradient>
      <linearGradient id="lining" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${TOMATO}"/><stop offset="1" stop-color="#A8392A"/>
      </linearGradient>
      <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFD9A0" stop-opacity=".42"/><stop offset="1" stop-color="#FFD9A0" stop-opacity=".06"/>
      </linearGradient>
      <radialGradient id="lampGlow"><stop offset="0" stop-color="#FFD9A0" stop-opacity=".5"/><stop offset="1" stop-color="#FFD9A0" stop-opacity="0"/></radialGradient>
      <radialGradient id="pool"><stop offset="0" stop-color="#FFD9A0" stop-opacity=".28"/><stop offset="1" stop-color="#FFD9A0" stop-opacity="0"/></radialGradient>
      <radialGradient id="phoneGlow"><stop offset="0" stop-color="#FFF1CC" stop-opacity=".95"/><stop offset=".35" stop-color="#FFD98A" stop-opacity=".45"/><stop offset="1" stop-color="#FFC060" stop-opacity="0"/></radialGradient>
      <radialGradient id="vignette" cx="50%" cy="50%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
    </defs>

    <g id="cam-root">
      <!-- Alley -->
      <rect x="-4000" y="-4000" width="10000" height="4900" fill="url(#bricks)"/>
      <rect x="-4000" y="900" width="10000" height="4000" fill="#14110E"/>
      <rect x="-4000" y="896" width="10000" height="8" fill="#2E2720"/>
      <g id="lit">
        <circle cx="720" cy="170" r="420" fill="url(#lampGlow)"/>
        <ellipse cx="900" cy="930" rx="520" ry="70" fill="url(#pool)"/>
        <polygon points="690,170 750,170 1330,905 400,905" fill="url(#cone)"/>
      </g>
      <!-- Poster -->
      <g transform="rotate(-4 600 400)">
        <polygon points="520,290 690,296 686,500 640,512 600,498 522,506" fill="#D9CCB4" opacity=".85"/>
        <text x="604" y="352" text-anchor="middle" font-family="F8" font-size="46" fill="#3A2F24">FREE*</text>
        <text x="604" y="392" text-anchor="middle" font-family="F8" font-size="27" fill="#3A2F24">CALENDAR</text>
        <rect x="548" y="410" width="112" height="46" fill="#3A2F24" opacity=".15"/>
        <text x="604" y="482" text-anchor="middle" font-family="F6" font-size="14" fill="#3A2F24">*you are the product</text>
      </g>
      <!-- Lamp -->
      <path d="M560 96 H722 V128" stroke="#0E0B09" stroke-width="10" fill="none"/>
      <rect x="548" y="80" width="20" height="36" fill="#0E0B09"/>
      <polygon points="682,128 762,128 784,170 660,170" fill="#0E0B09"/>
      <ellipse id="bulb" cx="722" cy="172" rx="30" ry="9" fill="#FFE7B8"/>
      <!-- Dumpster, bags, pipe, door -->
      <g>
        <rect x="150" y="700" width="380" height="200" rx="8" fill="#1F2A24"/>
        <polygon points="140,700 540,700 530,668 150,650" fill="#26342C"/>
        <rect x="170" y="730" width="340" height="10" fill="#18211C"/>
        <circle cx="200" cy="905" r="14" fill="#0B0908"/><circle cx="480" cy="905" r="14" fill="#0B0908"/>
        <path d="M545 905 C530 850 575 820 610 840 C650 815 690 860 675 905 Z" fill="#141210"/>
      </g>
      <rect x="1540" y="-200" width="30" height="1100" fill="#221C17"/>
      <rect x="1532" y="300" width="46" height="12" fill="#191410"/><rect x="1532" y="640" width="46" height="12" fill="#191410"/>
      <rect x="1650" y="470" width="190" height="430" fill="#110E0B" stroke="#241E18" stroke-width="6"/>
      <circle cx="1675" cy="690" r="6" fill="#3A3129"/>
      <ellipse cx="1370" cy="985" rx="170" ry="20" fill="#1E1A16"/>
      <ellipse id="puddleGlint" cx="1330" cy="985" rx="60" ry="5" fill="#FFD9A0" opacity=".25"/>

      <!-- The guy -->
      <g id="guy">
        <ellipse cx="1000" cy="925" rx="200" ry="22" fill="#000" opacity=".5"/>
        <rect x="956" y="820" width="36" height="96" fill="#15110E"/><rect x="1008" y="820" width="36" height="96" fill="#15110E"/>
        <ellipse cx="962" cy="918" rx="40" ry="13" fill="#0B0908"/><ellipse cx="1040" cy="918" rx="40" ry="13" fill="#0B0908"/>
        <polygon points="872,470 1128,470 1146,866 854,866" fill="#1A1511"/>
        ${flap('r', rightPts)}
        ${flap('l', LEFT_FLAP)}
        <path id="arm-l" stroke="${COAT_DARK}" stroke-width="56" stroke-linecap="round" fill="none"/>
        <path id="arm-r" stroke="${COAT_DARK}" stroke-width="56" stroke-linecap="round" fill="none"/>
        <circle id="hand-l" r="25" fill="${GLOVE}"/><circle id="hand-r" r="25" fill="${GLOVE}"/>
        <path d="M838 510 Q842 455 902 450 L1098 450 Q1158 455 1162 510 Z" fill="${COAT}"/>
        <path d="M838 510 Q842 455 902 450 L960 450" stroke="#9A7A5C" stroke-width="5" fill="none"/>
        <ellipse cx="1000" cy="432" rx="52" ry="60" fill="#0B0907"/>
        <polygon points="902,458 924,372 988,446" fill="#5E4632" stroke="#3A2C21" stroke-width="3" stroke-linejoin="round"/>
        <polygon points="1098,458 1076,372 1012,446" fill="#4F3C2D" stroke="#3A2C21" stroke-width="3" stroke-linejoin="round"/>
        <!-- Hat -->
        <path d="M936 394 C934 342 948 318 1000 316 C1052 318 1066 342 1064 394 Z" fill="#2B231C"/>
        <path d="M972 322 Q1000 338 1028 322" stroke="#15110D" stroke-width="5" fill="none"/>
        <rect x="936" y="370" width="128" height="22" fill="#110D0A"/>
        <ellipse cx="1000" cy="394" rx="134" ry="22" fill="#241D17"/>
        <path d="M870 392 Q900 374 960 372" stroke="#FFD9A0" stroke-width="3" opacity=".3" fill="none"/>
      </g>

      <!-- Coat-open glow and rays -->
      <g id="glow" opacity="0">
        <g id="rays"></g>
        <circle cx="${PHONE.x}" cy="${PHONE.y}" r="250" fill="url(#phoneGlow)"/>
      </g>

      <rect id="dark" x="-4000" y="-4000" width="10000" height="10000" fill="#050403"/>
      <g id="catEyes"><ellipse cx="596" cy="864" rx="7" ry="4" fill="#B7E36A"/><ellipse cx="622" cy="864" rx="7" ry="4" fill="#B7E36A"/></g>
      <g id="eyes">
        <ellipse id="eye-l" cx="982" cy="425" rx="8" ry="4.5" fill="${CREAM}"/>
        <ellipse id="eye-r" cx="1018" cy="425" rx="8" ry="4.5" fill="${CREAM}"/>
      </g>
      <g id="bubbles"></g>
      ${shhText}

      <rect id="flood" x="-4000" y="-4000" width="10000" height="10000" fill="${PAPER}" opacity="0"/>
      ${phone}
    </g>

    <rect id="vig" width="1920" height="1080" fill="url(#vignette)"/>

    <g id="final" opacity="0">
      <rect width="1920" height="1080" fill="${PAPER}"/>
      <g id="finalLogo">${logoMark('fl')}</g>
      <text id="word" x="960" y="760" text-anchor="middle" font-family="F8" font-size="140" fill="${INK}" letter-spacing="-2">OpenCal</text>
    </g>`;

  // Light rays behind the phone.
  let rays = '';
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2, w = 0.07;
    const p = (d, ang) => `${PHONE.x + d * Math.cos(ang)},${PHONE.y + d * Math.sin(ang)}`;
    rays += `<polygon points="${p(0, a)} ${p(560, a - w)} ${p(560, a + w)}" fill="#FFE3A8" opacity=".12"/>`;
  }
  $('rays').innerHTML = rays;

  buildBubbles();
  buildShh();
}

// Speech bubbles: typed character by character; each character gets a voice blip cue.
const bubbles = [];
const CUES = [];
function buildBubbles() {
  const g = $('bubbles');
  const FS = 46, LH = 60, PADX = 38, PADY = 30, BX = 1108, BY = 336, TIP = [1066, 398];
  const measure = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  attr(measure, { 'font-family': 'F6', 'font-size': FS });
  g.appendChild(measure);
  LINES.forEach((lines, bi) => {
    const w = Math.max(...lines.map((l) => ((measure.textContent = l), measure.getComputedTextLength()))) + PADX * 2;
    const h = lines.length * LH + PADY * 2 - (LH - FS) + 6;
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    el.innerHTML = `
      <polygon points="${BX + 34},${BY - 4} ${BX + 88},${BY - 4} ${TIP[0]},${TIP[1]}" fill="${CREAM}" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
      <rect x="${BX}" y="${BY - h}" width="${w}" height="${h}" rx="30" fill="${CREAM}" stroke="${INK}" stroke-width="5"/>
      <polygon points="${BX + 37},${BY - 8} ${BX + 85},${BY - 8} ${TIP[0] + 4},${TIP[1] - 8}" fill="${CREAM}"/>
      ${lines.map((_, li) => `<text x="${BX + PADX}" y="${BY - h + PADY + FS * 0.8 + li * LH}" font-family="F6" font-size="${FS}" fill="${INK}"></text>`).join('')}`;
    g.appendChild(el);
    // Per-character timestamps with pauses after punctuation.
    const start = T.bubbles[bi] + 0.14;
    const chars = [];
    let t = start;
    lines.forEach((line, li) => {
      for (const ch of line) {
        chars.push({ li, ch, t });
        if (/[a-z]/i.test(ch)) CUES.push({ t, type: 'blip', seed: CUES.length });
        t += 1 / CPS + (/[.?,]/.test(ch) ? 0.1 : 0);
      }
      t += 0.05;
    });
    CUES.push({ t: T.bubbles[bi], type: 'pop' });
    const next = T.bubbles[bi + 1] ?? T.coat[0] - 0.05;
    bubbles.push({ el, lines, chars, pop: T.bubbles[bi], out: next - 0.12, texts: [...el.querySelectorAll('text')] });
  });
  measure.remove();
  bubbles.tip = TIP;
}

// "Shhhh..." written letter by letter in tomato pen, in the scene just above the open side of the
// coat, so the camera's dive carries it out of frame.
const shh = [];
function buildShh() {
  const g = $('shh');
  const FS = 92, Y = 446, X0 = 1082;
  const m = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  attr(m, { 'font-family': 'F8i', 'font-size': FS });
  g.appendChild(m);
  m.textContent = SHH;
  const total = m.getComputedTextLength();
  let x = X0;
  const inner = [];
  [...SHH].forEach((ch, i) => {
    m.textContent = SHH.slice(0, i + 1);
    const right = X0 + m.getComputedTextLength();
    inner.push(`<clipPath id="sc${i}"><rect id="scr${i}" x="${x - 14}" y="${Y - FS}" width="0" height="${FS * 1.4}"/></clipPath>
      <text x="${x}" y="${Y}" font-family="F8i" font-size="${FS}" fill="${TOMATO_NIGHT}" clip-path="url(#sc${i})">${ch}</text>`);
    const dt = ch === '.' ? 0.05 : 0.075;
    const t0 = shh.length ? shh[shh.length - 1].t1 : T.shh;
    shh.push({ w: right - x + 28, t0, t1: t0 + dt });
    x = right;
  });
  m.remove();
  g.innerHTML = `<g transform="rotate(-6 ${X0} ${Y})">${inner.join('')}
    <path id="shhLine" d="M${X0 + 6} ${Y + 20} Q ${X0 + total / 2} ${Y + 10} ${X0 + total - 24} ${Y + 22}" pathLength="1" stroke="${TOMATO_NIGHT}" stroke-width="6" stroke-linecap="round" fill="none"/></g>`;
  CUES.push({ t: T.shh, type: 'hiss', dur: shh[shh.length - 1].t1 - T.shh + 0.35 });
}

// Lamp flicker: [start, level] steps.
const FLICKER = [[0, 0], [0.18, 0.8], [0.25, 0.05], [0.34, 0.6], [0.4, 0], [0.5, 1]];
for (const [t, l] of FLICKER) if (l > 0.3) CUES.push({ t, type: 'flicker' });
CUES.push({ t: T.coat[0], type: 'whoosh', dur: 0.55 });
CUES.push({ t: T.coat[0] + 0.35, type: 'shine', dur: 1.4 });
CUES.push({ t: T.swing[0] + 0.1, type: 'whoosh', dur: 1.5, big: true });
CUES.push({ t: T.ring[0], type: 'pen', dur: T.ring[1] - T.ring[0] });

function lampLevel(t) {
  let l = 0;
  for (const [s, v] of FLICKER) if (t >= s) l = v;
  return l;
}

function flapScale(t) {
  // The coat's right side: 1 = closed; -1 = swung fully open, lining out.
  return lerp(1, -1, ease.inOut(seg(t, ...T.coat)));
}

function seek(t) {
  // Lamp and darkness.
  const L = lampLevel(t);
  $('lit').style.opacity = L;
  $('bulb').style.opacity = 0.25 + 0.75 * L;
  $('puddleGlint').style.opacity = 0.25 * L;
  $('dark').style.opacity = 0.94 * (1 - L) + 0.08;
  // The cat stays put the whole time, blinking now and then (a bit less glowy once the lamp is on).
  const catBlink = [1.6, 3.3, 4.9].some((b) => t > b && t < b + 0.12);
  $('catEyes').style.opacity = catBlink ? 0 : 1 - 0.2 * L;

  // Coat: the left side stays shut; the right side swings open. Hands hold the lapels, then the
  // right hand pulls its side open.
  const s = flapScale(t);
  for (const side of ['l', 'r']) {
    const fs = side === 'l' ? 1 : s;
    const px = side === 'l' ? PIVOT : 2000 - PIVOT;
    $(`flap-${side}`).setAttribute('transform', `translate(${px} 0) scale(${Math.abs(fs) < 0.02 ? 0.02 * Math.sign(fs || 1) : fs} 1) translate(${-px} 0)`);
    $(`flap-${side}-out`).style.display = fs >= 0 ? '' : 'none';
    $(`flap-${side}-in`).style.display = fs < 0 ? '' : 'none';
    const dir = side === 'l' ? 1 : -1;
    const hx = px + dir * (FREE - PIVOT) * 0.86 * fs;
    const hy = 590 - 35 * (1 - fs);
    const sh = [px + dir * 6, 505];
    const ctrl = [px - dir * (30 + 16 * (1 - fs)), 640 - 30 * (1 - fs)];
    $(`arm-${side}`).setAttribute('d', `M${sh[0]} ${sh[1]} Q${ctrl[0]} ${ctrl[1]} ${hx} ${hy}`);
    attr($(`hand-${side}`), { cx: hx, cy: hy });
  }
  // The phone rides in the lining's pocket: squashed with the flap while it swings.
  const P = 2000 - PIVOT;
  $('phoneWrap').style.display = s < 0 ? '' : 'none';
  $('phoneWrap').setAttribute('transform', `translate(${P} 0) scale(${Math.max(0.02, -s)} 1) translate(${-P} 0)`);
  const g = ease.out(seg(t, T.coat[0] + 0.2, T.coat[1] + 0.25));
  $('glow').style.opacity = g * (1 - seg(t, T.flood[0], T.flood[1]));
  $('rays').setAttribute('transform', `rotate(${t * 9} ${PHONE.x} ${PHONE.y})`);

  // Eyes: shifty glances, blinks, a wink on "I got you."
  let dx = 0;
  if (t > 0.55 && t < 0.85) dx = -6 * ease.out(seg(t, 0.55, 0.65));
  else if (t >= 0.85 && t < 1.3) dx = lerp(-6, 6, ease.inOut(seg(t, 0.85, 0.97))) * (1 - seg(t, 1.2, 1.3));
  const blink = (t0) => (t > t0 && t < t0 + 0.13 ? 0.2 : 1);
  const bl = Math.min(blink(2.2), blink(3.7));
  const wink = T.bubbles[2] + 0.45;
  const w = t > wink && t < wink + 0.45 ? 0.15 : 1;
  attr($('eye-l'), { cx: 982 + dx, ry: 4.5 * bl });
  attr($('eye-r'), { cx: 1018 + dx, ry: 4.5 * Math.min(bl, w) });
  $('eyes').style.opacity = 1 - seg(t, T.swing[0], T.swing[0] + 0.3);

  // Bubbles.
  for (const b of bubbles) {
    const k = ease.outBack(seg(t, b.pop, b.pop + 0.24)) * (1 - ease.in(seg(t, b.out, b.out + 0.12)));
    b.el.style.display = k > 0.001 ? '' : 'none';
    b.el.setAttribute('transform', `translate(${bubbles.tip[0]} ${bubbles.tip[1]}) scale(${k}) translate(${-bubbles.tip[0]} ${-bubbles.tip[1]})`);
    b.texts.forEach((el, li) => (el.textContent = b.chars.filter((c) => c.li === li && c.t <= t).map((c) => c.ch).join('')));
  }

  // "Shhhh..." letters and underline.
  shh.forEach((l, i) => $(`scr${i}`).setAttribute('width', l.w * ease.out(seg(t, l.t0, l.t1))));
  const last = shh[shh.length - 1].t1;
  drawOn($('shhLine'), ease.inOut(seg(t, last, last + 0.25)));

  // Camera: slow push, then a swinging dive into the phone.
  const drift = seg(t, 0, T.swing[0]);
  const k0 = 1 + 0.05 * drift, c0 = [960 + 30 * drift, 540 + 40 * drift];
  const e = ease.inOut(seg(t, ...T.swing));
  const ec = ease.inOut(seg(t, T.swing[0], T.swing[1] - 0.25));
  const k = Math.exp(lerp(Math.log(k0), Math.log(FINAL_SCALE), e));
  const arc = Math.sin(Math.PI * ec);
  const cx = lerp(c0[0], PHONE.x, ec) - 70 * arc;
  const cy = lerp(c0[1], PHONE.y, ec);
  const rot = -PHONE.rot * e - 9 * Math.sin(Math.PI * e);
  $('cam-root').setAttribute('transform', `translate(960 540) rotate(${rot}) scale(${k}) translate(${-cx} ${-cy})`);
  const f = ease.inOut(seg(t, ...T.flood));
  $('flood').style.opacity = f;
  $('bezel').style.opacity = 1 - f;
  $('cam').style.opacity = 1 - f;
  $('pocket').style.opacity = 1 - f;
  $('vig').style.opacity = 1 - f;

  // Final: the same logo, full frame; the pen circles the date, then the wordmark.
  const onFinal = t >= T.swing[1];
  $('final').style.opacity = onFinal ? 1 : 0;
  $('cam-root').style.display = onFinal ? 'none' : '';
  const st = ease.inOut(seg(t, ...T.settle));
  const size = lerp(400, 330, st), ly = lerp(540, 420, st);
  $('finalLogo').setAttribute('transform', `translate(960 ${ly}) scale(${size / 1000}) translate(-500 -500)`);
  drawOn($('fl-ring'), ease.inOut(seg(t, ...T.ring)));
  drawOn($('pl-ring'), 0);
  const wd = ease.out(seg(t, ...T.word));
  $('word').style.opacity = wd;
  $('word').setAttribute('transform', `translate(0 ${30 * (1 - wd)})`);
}

window.DURATION = T.end;
window.CUES = CUES;
window.MARKERS = { dive: T.swing[0] };
Promise.all(['600 46px F6', '800 100px F8', 'italic 800 100px F8i', '800 100px F8i'].map((f) => document.fonts.load(f))).then(() => {
  build();
  window.seek = seek;
  seek(0);
});
</script>
</body>
