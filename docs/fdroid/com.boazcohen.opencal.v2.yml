# DRAFT v2 for the resubmission (see docs/fdroid/RESUBMIT.md, "Test results"). Differences from the first
# submission:
# - Node comes from Debian forky and the build uses the image's JDK 21 (patched like com.scariflabs.horus), so
#   nothing is downloaded in `sudo`; the NDK is pinned by its full version. `commit` is the full hash.
# - One APK per ABI instead of one ~90 MB APK with four. versionCode = 10 * app versionCode + ABI number
#   (1 armeabi-v7a, 2 x86, 3 arm64-v8a, 4 x86_64), patched in with $$VERCODE$$ and kept by VercodeOperation.
# - `scandelete: node_modules` replaces the long list of paths; the scanignore entries stay because the scanner
#   would otherwise delete those Gradle files instead of ignoring their local maven repos.
# - Library modules get the app's NDK (Gradle would otherwise download AGP's default NDK during the build) and
#   the encrypted Google dependency-metadata block is left out of the APK.

Categories:
  - Calendar & Agenda
License: MIT
AuthorName: Boaz Cohen
WebSite: https://github.com/BoazCohenJ/OpenCal
SourceCode: https://github.com/BoazCohenJ/OpenCal
IssueTracker: https://github.com/BoazCohenJ/OpenCal/issues
Changelog: 
  https://github.com/BoazCohenJ/OpenCal/tree/HEAD/metadata/android/en-US/changelogs

AutoName: OpenCal

RepoType: git
Repo: https://github.com/BoazCohenJ/OpenCal.git

Builds:
  - versionName: 1.7.0
    versionCode: 107001
    commit: 0c7de94c7fbe75d6e94ef6b851006068c029d02d
    timeout: 7200
    sudo:
      - apt-get update
      - apt-get install -y cmake ninja-build build-essential zlib1g-dev libicu-dev
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky nodejs npm
    output: android/app/build/outputs/apk/release/app-release.apk
    srclibs:
      - hermes@hermes-v250829098.0.17
    prebuild:
      - export OPENCAL_VARIANT=fdroid
      - npm ci --no-audit --no-fund
      - npm uninstall expo-updates
      - npm pkg set --json 'expo.autolinking.android.buildFromSource=[".*"]'
      - npx expo prebuild --platform android --no-install --clean
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - cmake -S $$hermes$$ -B $$hermes$$/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - cmake --build $$hermes$$/build --target hermesc -j 4
      - sed -i 's#^ *hermesCommand = new File.*#    hermesCommand = "$$hermes$$/build/bin/hermesc"#'
        android/app/build.gradle
      - sed -i 's/versionCode [0-9]*/versionCode $$VERCODE$$/' android/app/build.gradle
      - printf '\nsubprojects { p -> p.plugins.withId("com.android.library") { p.android.ndkVersion
        = rootProject.ext.ndkVersion } }\n' >> android/build.gradle
      - printf '\nandroid { dependenciesInfo { includeInApk = false; includeInBundle
        = false } }\n' >> android/app/build.gradle
    scanignore:
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
    scandelete:
      - node_modules
    build:
      - export OPENCAL_VARIANT=fdroid
      - cd android
      - gradle assembleRelease -x lint -PreactNativeArchitectures=armeabi-v7a
    ndk: 27.1.12297006

